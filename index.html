<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Praxis Sandbox - Interactive Learning Platform">
    <meta name="theme-color" content="#2c3e50">
    <title>Praxis Sandbox</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div id="app"></div>
    <!-- bcryptjs is a UMD build: loaded as a classic script so it registers window.dcodeIO.bcrypt -->
    <script src="lib/bcryptjs.min.js"></script>
    <script type="module" src="src/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.error('SW registration failed:', err));
        }
    </script>
</body>
</html>
